name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Site (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # LayoutProps and the route types live in .next/, which a fresh checkout does not have.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  api:
    name: API (Express + Postgres)
    runs-on: ubuntu-latest
    services:
      # Same Postgres version as docker-compose.yml, only with the test database.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://radar:radar@localhost:5433/radar_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
